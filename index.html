<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HSR Warp Tracker & Analytics</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e2e8f0; margin: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #1a1d24; border: 1px solid #2d3748; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    h2, h3 { color: #48bb78; margin-top: 0; }
    
    /* Input Form Styles */
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    input, select, button { padding: 10px; background: #2d3748; border: 1px solid #4a5568; color: #fff; border-radius: 4px; }
    button { background: #38a169; cursor: pointer; font-weight: bold; border: none; }
    button:hover { background: #2f855a; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    .stat-box { background: #2d3748; padding: 15px; border-radius: 6px; text-align: center; }
    .stat-val { font-size: 1.6em; font-weight: bold; color: #ecc94b; }
    .stat-lbl { font-size: 0.85em; color: #a0aec0; }

    /* Grid Display for 5-Star pulls */
    .pull-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 15px; }
    .pull-card { background: #2d3748; border-radius: 6px; padding: 10px; text-align: center; border: 2px solid #ecc94b; position: relative; }
    .pull-card.lost { border-color: #e53e3e; }
    .avatar-img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #1a1d24; margin: 0 auto 8px; display: block; }
    .pity-badge { background: #d69e2e; color: #1a202c; font-weight: bold; padding: 2px 6px; border-radius: 10px; font-size: 0.8em; }
    .outcome-tag { font-size: 0.75em; margin-top: 4px; }
    .won-text { color: #48bb78; }
    .lost-text { color: #f56565; }
  </style>
</head>
<body>

<div class="container">
  <!-- Manual Input Card -->
  <div class="card">
    <h2>Add Warp Entry</h2>
    <div class="form-group">
      <input type="text" id="charName" placeholder="Character Name (e.g. Acheron)" required />
      <input type="number" id="pityCount" placeholder="Pity Count (1-90)" min="1" max="90" required />
      <select id="winStatus">
        <option value="win">50/50 Won (Featured)</option>
        <option value="loss">50/50 Lost (Standard)</option>
        <option value="guaranteed">Guaranteed</option>
      </select>
      <input type="file" id="customImg" accept="image/png, image/jpeg" title="Optional custom PNG" />
      <button onclick="addPull()">Add Warp Record</button>
    </div>
  </div>

  <!-- Analytics Dashboard -->
  <div class="card">
    <h2>Warp Analytics</h2>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val" id="totalPulls">0</div><div class="stat-lbl">Total Warps Executed</div></div>
      <div class="stat-box"><div class="stat-val" id="totalFiveStars">0</div><div class="stat-lbl">Total 5★ Pulled</div></div>
      <div class="stat-box"><div class="stat-val" id="winRate">0%</div><div class="stat-lbl">50/50 Win Rate</div></div>
      <div class="stat-box"><div class="stat-val" id="avgPity">0</div><div class="stat-lbl">Average 5★ Pity</div></div>
    </div>
  </div>

  <!-- Graphic 5-Star Storage Display -->
  <div class="card">
    <h3>5-Star Collection History</h3>
    <div id="pullDisplay" class="pull-grid"></div>
  </div>
</div>

<script>
  // Persistent Storage Key
  let warpData = JSON.parse(localStorage.getItem('hsr_warp_history')) || [];

  // Default image links that bypass CORS restrictions
  const defaultAvatars = {
    "kafka": "https://upload.wikimedia.org/wikipedia/commons/3/3f/Placeholder_view_vector.svg",
    "acheron": "https://upload.wikimedia.org/wikipedia/commons/3/3f/Placeholder_view_vector.svg"
  };

  function addPull() {
    const nameInput = document.getElementById('charName').value.trim();
    const pityInput = parseInt(document.getElementById('pityCount').value);
    const winInput = document.getElementById('winStatus').value;
    const fileInput = document.getElementById('customImg');

    if (!nameInput || isNaN(pityInput)) {
      alert("Please provide a character name and valid pity count.");
      return;
    }

    const processEntry = (imgDataUrl) => {
      const entry = {
        id: Date.now(),
        name: nameInput,
        pity: pityInput,
        outcome: winInput,
        image: imgDataUrl || null
      };
      
      warpData.push(entry);
      localStorage.setItem('hsr_warp_history', JSON.stringify(warpData));
      updateDashboard();
      
      // Reset inputs
      document.getElementById('charName').value = '';
      document.getElementById('pityCount').value = '';
      document.getElementById('customImg').value = '';
    };

    // Handle local image file conversion to base64 for persistent storage
    if (fileInput.files && fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => processEntry(e.target.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      processEntry(null);
    }
  }

  function updateDashboard() {
    const total5 = warpData.length;
    let totalPulls = 0;
    let wins = 0;
    let total5050s = 0;

    warpData.forEach(p => {
      totalPulls += p.pity;
      if (p.outcome === 'win') {
        wins++;
        total5050s++;
      } else if (p.outcome === 'loss') {
        total5050s++;
      }
    });

    const avgPity = total5 > 0 ? (totalPulls / total5).toFixed(1) : 0;
    const winRate = total5050s > 0 ? ((wins / total5050s) * 100).toFixed(1) + '%' : 'N/A';

    // Update DOM Analytics
    document.getElementById('totalPulls').innerText = totalPulls;
    document.getElementById('totalFiveStars').innerText = total5;
    document.getElementById('avgPity').innerText = avgPity;
    document.getElementById('winRate').innerText = winRate;

    // Render Image Cards
    const display = document.getElementById('pullDisplay');
    display.innerHTML = '';

    warpData.slice().reverse().forEach(p => {
      const card = document.createElement('div');
      card.className = `pull-card ${p.outcome === 'loss' ? 'lost' : ''}`;
      
      // Fallback for image loading: standard placeholder with character initial if image fails
      const fallbackSrc = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2d3748&color=ecc94b`;
      const imgSrc = p.image || defaultAvatars[p.name.toLowerCase()] || fallbackSrc;

      card.innerHTML = `
        <img src="${imgSrc}" class="avatar-img" onerror="this.src='${fallbackSrc}'" alt="${p.name}">
        <div style="font-weight: bold; font-size: 0.9em; margin-bottom: 4px;">${p.name}</div>
        <span class="pity-badge">${p.pity} Pity</span>
        <div class="outcome-tag ${p.outcome === 'loss' ? 'lost-text' : 'won-text'}">
          ${p.outcome.toUpperCase()}
        </div>
      `;
      display.appendChild(card);
    });
  }

  // Initial load execution
  updateDashboard();
</script>
</body>
</html>
